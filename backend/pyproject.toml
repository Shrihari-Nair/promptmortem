[project]
name = "prompt-validator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "litellm>=1.50",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "jsonschema>=4",
  "langdetect>=1.0.9",
  "dspy>=3.4,<3.5",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]  # without it, a hashed n-gram embedding is used

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
